name: Market weather check (quick test)

on:
  workflow_dispatch:      # run by hand: tests the jobs / inflation / Fed data sources in ~1 min

jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python -c "import scanner; scanner.get_bls(['LNS14000000','CES0000000001','CUUR0000SA0','CUUR0000SA0L1E'], debug=True); m = scanner.macro_weather(); print(m['regime']); print(chr(10).join(m['notes']))"
