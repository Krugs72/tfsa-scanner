name: Daily TFSA scan

on:
  schedule:
    # Weekday mornings 09:17 UTC (~3:17am Edmonton; the bigger scan takes ~30-40 min). GitHub often starts scheduled runs late, so this leaves room before the 6:41am brief
    - cron: "17 9 * * 1-5"
  workflow_dispatch:      # lets you hit "Run workflow" by hand in the Actions tab

permissions:
  contents: write         # so it can save the reports back into the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scanner.py

      - name: Save reports to the repo
        run: |
          git config user.name "tfsa-scanner bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git commit -m "Weekly scan $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase -X theirs origin main || true
          git push
