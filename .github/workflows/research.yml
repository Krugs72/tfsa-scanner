name: One-off research script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Python file in tools/ to run"
        default: "compare_etfs.py"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/${{ github.event.inputs.script }}
